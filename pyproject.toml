[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quiabo"
description = "Backend web service for running OCR processes"
version = "0.0.1"
dependencies = [
    "celery",
    "flask",
    "flower",
    "gunicorn",
    "psycopg2",
    "redis",
    "sqlalchemy"
]
requires-python = ">= 3.13, < 3.15"
authors = [
    {name = "maría a. matienzo"},
    {name = "Jason Raitz"},
    {name = "Steve Sullivan"},
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
lint = [
    "mypy ~= 1.17.1",
    "pydoclint ~= 0.6.10",
    "pylint ~= 3.3",
]

[project.urls]
Repository = "https://github.com/BerkeleyLibrary/quiabo"
Issues = "https://github.com/BerkeleyLibrary/quiabo"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true

[tool.pydoclint]
allow-init-docstring = true
skip-checking-raises = true
style = "sphinx"

[tool.pytest]
minversion = "9.0"
addopts = [
    "-v",
    "-s",
    "--junit-xml=artifacts/pytest.xml",
    "--cov-report=term",
    "--cov-report=html:artifacts/coverage",
    "--cov=quiabo",
]
markers = [
    "unit: fast isolated unit tests with no external dependencies",
]

[tool.setuptools]
py-modules = ["quiabo"]
